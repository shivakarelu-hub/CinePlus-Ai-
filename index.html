<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse AI - Daily Movie Updates</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🎬</span>
                <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-red-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent">CINEPULSE AI</h1>
            </div>
            <p class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">🤖 AI-Powered Daily Cinema Dispatch</p>
        </div>
    </header>

    <!-- Navigation Categories -->
    <nav class="max-w-7xl mx-auto px-4 py-6 flex flex-wrap gap-2 justify-center" id="category-filters">
        <button onclick="filterCategory('all')" class="cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-red-600 text-white shadow-lg shadow-red-600/30">All Updates</button>
        <button onclick="filterCategory('tollywood')" class="cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800">Tollywood</button>
        <button onclick="filterCategory('bollywood')" class="cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800">Bollywood</button>
        <button onclick="filterCategory('hollywood')" class="cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800">Hollywood</button>
    </nav>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 pb-16">
        <div id="loading" class="text-center py-20 text-slate-400">Loading latest AI movie intelligence...</div>
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Will Load Here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 CinePulse AI. Updated daily via automated AI pipelines.</p>
    </footer>

    <script>
        let allNews = [];

        async function fetchNews() {
            try {
                // In production, this loads your daily generated JSON file
                const response = await fetch('news.json');
                if (!response.ok) throw new Error("Could not load news data.");
                allNews = await response.json();
                displayNews(allNews);
            } catch (error) {
                // Fallback demo data if news.json doesn't exist yet
                allNews = [
                    {
                        category: "tollywood",
                        title: "Game Changer shoot wrapped up with massive climax action sequence",
                        type: "Shooting Update",
                        date: "Nov 2, 2026",
                        summary: "Director Shankar has officially wrapped the final schedule. Post-production visual effects are moving at a rapid pace for the Sankranthi release.",
                        badgeColor: "bg-amber-500/10 text-amber-400 border-amber-500/20"
                    },
                    {
                        category: "bollywood",
                        title: "Pathaan 2 pre-production kicks off with high-octane international script",
                        type: "Next Project",
                        date: "Nov 2, 2026",
                        summary: "YRF has locked the script. Shah Rukh Khan is slated to begin physical training regimens starting next month ahead of the floor dates.",
                        badgeColor: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
                    },
                    {
                        category: "hollywood",
                        title: "Avatar 4 milestone: Box Office projections and production status",
                        type: "Box Office / Shoot",
                        date: "Nov 1, 2026",
                        summary: "James Cameron confirms groundbreaking underwater performance capture techniques completed ahead of schedule, setting up a massive holiday window.",
                        badgeColor: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20"
                    }
                ];
                displayNews(allNews);
            }
        }

        function displayNews(newsArray) {
            const grid = document.getElementById('news-grid');
            document.getElementById('loading').style.display = 'none';
            grid.innerHTML = '';

            if(newsArray.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">No updates found for this category.</div>`;
                return;
            }

            newsArray.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between hover:border-slate-700 transition shadow-xl">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs uppercase tracking-wider font-bold px-3 py-1 rounded-full border ${item.badgeColor || 'bg-blue-500/10 text-blue-400 border-blue-500/20'}">${item.type}</span>
                                <span class="text-xs text-slate-500">${item.date}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-100 mb-2 leading-snug">${item.title}</h3>
                            <p class="text-sm text-slate-400 mb-4 leading-relaxed">${item.summary}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-500 font-medium uppercase tracking-wider">
                            <span class="text-red-400">#${item.category}</span>
                            <span>AI Verified</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            // Update button styles
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800";
            });
            event.target.className = "cat-btn px-5 py-2 rounded-full font-semibold text-sm transition bg-red-600 text-white shadow-lg shadow-red-600/30";

            if(category === 'all') {
                displayNews(allNews);
            } else {
                const filtered = allNews.filter(item => item.category === category);
                displayNews(filtered);
            }
        }

        fetchNews();
    </script>
</body>
</html>
